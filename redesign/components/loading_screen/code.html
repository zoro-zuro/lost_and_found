<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Warm Loading Screen - College Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;family=Delius&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#4A6CF7",
                        peach: "#ffedda",
                        mint: "#e6fffa",
                        lavender: "#f3f0ff",
                        "background-warm": "#fffcf9"
                    },
                    fontFamily: {
                        quicksand: ["Quicksand", "sans-serif"],
                        hand: ["Delius", "cursive"]
                    }
                }
            }
        };
    </script>
<style type="text/tailwindcss">
        @layer base {
            body { 
                @apply bg-background-warm text-slate-800 font-quicksand overflow-hidden;
            }
        }
        .mesh-bg {
            background-color: #fffcf9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 237, 218, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(230, 255, 250, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(243, 240, 255, 0.5) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(255, 237, 218, 0.4) 0px, transparent 50%);
        }
        .organic-shape {
            position: absolute;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.4;
            border-radius: 50%;
        }
        .hand-drawn-backpack {
            width: 120px;
            height: 140px;
            background: #f3f0ff;
            border: 3px solid #6366f1;
            border-radius: 30px 30px 15px 15px;
            position: relative;
            box-shadow: 4px 4px 0px rgba(99, 102, 241, 0.1);
        }
        .hand-drawn-pocket {
            width: 80px;
            height: 50px;
            background: #e6fffa;
            border: 3px solid #6366f1;
            border-radius: 12px;
            position: absolute;
            bottom: 20px;
            left: 20px;
        }
        .hand-drawn-handle {
            width: 40px;
            height: 20px;
            border: 3px solid #6366f1;
            border-radius: 20px 20px 0 0;
            position: absolute;
            top: -15px;
            left: 40px;
        }
        .magnifying-glass-orbit {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            animation: rotate 4s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .glass-head {
            width: 45px;
            height: 45px;
            background: rgba(255, 237, 218, 0.9);
            border: 3px solid #4A6CF7;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-handle {
            width: 4px;
            height: 20px;
            background: #4A6CF7;
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%) rotate(-10deg);
            border-radius: 2px;
        }
        .progress-glow {
            box-shadow: 0 0 15px rgba(74, 108, 247, 0.3);
        }
        .hand-drawn-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 3s ease forwards;
        }
        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body class="mesh-bg min-h-screen flex flex-col items-center justify-center relative">
<div class="organic-shape bg-peach w-[500px] h-[500px] -top-20 -left-20"></div>
<div class="organic-shape bg-lavender w-[400px] h-[400px] bottom-0 right-0"></div>
<div class="organic-shape bg-mint w-72 h-72 top-1/4 right-1/4"></div>
<div class="relative w-80 h-80 flex items-center justify-center">
<div class="magnifying-glass-orbit">
<div class="glass-head">
<div class="glass-handle"></div>
<div class="w-2 h-2 bg-white rounded-full absolute top-2 right-2 opacity-60"></div>
</div>
</div>
<div class="hand-drawn-backpack flex items-center justify-center">
<div class="hand-drawn-handle"></div>
<div class="hand-drawn-pocket"></div>
<div class="absolute top-8 left-6 w-12 h-0.5 bg-indigo-200 rounded-full"></div>
<div class="absolute top-12 left-6 w-8 h-0.5 bg-indigo-200 rounded-full"></div>
</div>
</div>
<div class="mt-12 text-center">
<h2 class="text-2xl font-bold text-slate-700 tracking-tight">
            Searching the hub for you...
        </h2>
<p class="mt-2 text-slate-400 font-hand italic text-lg">
            We're gathering all the latest finds.
        </p>
</div>
<div class="mt-16 w-64 h-2.5 bg-slate-100 rounded-full overflow-hidden p-0.5">
<div class="h-full bg-primary rounded-full progress-glow animate-[loading_2s_ease-in-out_infinite]" style="width: 45%;"></div>
</div>
<style>
        @keyframes loading {
            0% { width: 10%; margin-left: 0%; }
            50% { width: 40%; margin-left: 60%; }
            100% { width: 10%; margin-left: 0%; }
        }
    </style>
<div class="absolute bottom-12 flex items-center gap-2 opacity-50">
<span class="material-symbols-outlined text-slate-400">favorite</span>
<span class="text-xs font-bold uppercase tracking-[0.2em] text-slate-500">College Community Hub</span>
</div>
<div class="absolute top-1/4 left-1/4 w-4 h-4 rounded-full bg-peach/40 border border-peach/60"></div>
<div class="absolute bottom-1/3 right-1/3 w-6 h-6 rounded-full bg-mint/40 border border-mint/60"></div>
<div class="absolute top-1/2 left-2/3 w-3 h-3 rounded-full bg-lavender/40 border border-lavender/60"></div>

</body></html>
