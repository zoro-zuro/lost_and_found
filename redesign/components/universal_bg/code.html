<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Refined Collegiate Mesh Background</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#6366f1",
              peach: "#FFD8B1",
              mint: "#D1F2EB",
              lavender: "#E8DAEF",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .mesh-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-color: #FAF9F6;}
        .dark .mesh-container {
            background-color: #0f172a;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.6;
        }.blob-1 {
            top: -10%;
            left: -10%;
            width: 60vw;
            height: 60vw;
            background-color: #FFD8B1;
        }.blob-2 {
            top: -5%;
            right: -5%;
            width: 50vw;
            height: 50vw;
            background-color: #E8DAEF;
        }.blob-3 {
            top: 30%;
            left: 15%;
            width: 45vw;
            height: 45vw;
            background-color: #D1F2EB;
            opacity: 0.5;
        }.blob-4 {
            bottom: -10%;
            right: 5%;
            width: 55vw;
            height: 55vw;
            background-color: #FFD8B1;
            opacity: 0.4;
        }.blob-5 {
            bottom: -5%;
            left: -5%;
            width: 40vw;
            height: 40vw;
            background-color: #E8DAEF;
            opacity: 0.4;
        }
        .frosted-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(60px);
            -webkit-backdrop-filter: blur(60px);
            z-index: 10;
        }
        .dark .frosted-overlay {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(80px);
        }
        .dark .blob { opacity: 0.25; }
        .dark .blob-1 { background-color: #7c2d12; }
        .dark .blob-2 { background-color: #4c1d95; }
        .dark .blob-3 { background-color: #064e3b; }
        .dark .blob-4 { background-color: #7c2d12; }
        .dark .blob-5 { background-color: #4c1d95; }
        .theme-toggle {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 100;
            padding: 0.75rem;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="bg-[#FAF9F6] dark:bg-[#0f172a] transition-colors duration-500">
<div class="mesh-container overflow-hidden">
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>
<div class="blob blob-4"></div>
<div class="blob blob-5"></div>
<div class="frosted-overlay"></div>
</div>
<button class="theme-toggle bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border border-white/20 dark:border-slate-700/50 text-slate-800 dark:text-white flex items-center justify-center hover:scale-110 transition-transform" onclick="document.documentElement.classList.toggle('dark')">
<svg class="h-6 w-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 3v1m0 16v1m9-9h-1M4 9H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707m12.728 0A9 9 0 1111.25 12.75" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<svg class="h-6 w-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>

</body></html>
