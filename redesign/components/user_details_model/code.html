<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Warm User Detail Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style type="text/tailwindcss">
        :root {
            --primary-royal-blue: #4A6CF7;
            --navy-text: #1A202C;
            --peach: #FFD6C9;
            --mint: #C9FFE5;
            --lavender: #E0D7FF;
        }
        body {
            font-family: 'Quicksand', sans-serif;
        }
        .mesh-gradient {
            background-color: #f3f4f6;
            background-image: 
                radial-gradient(at 15% 15%, var(--peach) 0px, transparent 40%),
                radial-gradient(at 85% 10%, var(--mint) 0px, transparent 40%),
                radial-gradient(at 85% 85%, var(--lavender) 0px, transparent 40%),
                radial-gradient(at 15% 85%, var(--mint) 0px, transparent 40%),
                radial-gradient(at 50% 50%, var(--lavender) 0px, transparent 50%);
            background-size: cover;
        }
        .glass-modal {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 1);
            border-radius: 32px;
        }
        .bento-card {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
        }
        .profile-avatar {
            border-radius: 12px;
        }
    </style>
</head>
<body class="mesh-gradient min-h-screen flex items-center justify-center p-6 selection:bg-[var(--primary-royal-blue)] selection:text-white">
<div class="glass-modal w-full max-w-md p-8 shadow-[0_20px_50px_rgba(0,0,0,0.1)] relative">
<div class="flex flex-col items-center mb-8">
<div class="profile-avatar w-24 h-24 bg-white shadow-sm flex items-center justify-center mb-5 overflow-hidden">
<div class="w-full h-full bg-gradient-to-br from-indigo-50 to-blue-100 flex items-center justify-center">
<span class="text-4xl font-bold text-[var(--primary-royal-blue)]">Y</span>
</div>
</div>
<h1 class="text-3xl font-bold text-[var(--navy-text)] mb-2">yasin</h1>
<div class="bg-white/60 px-4 py-1.5 rounded-full border border-white shadow-sm">
<span class="text-[10px] font-bold tracking-[0.15em] text-[var(--primary-royal-blue)] uppercase">
                    Student • Verified Member
                </span>
</div>
</div>
<div class="grid grid-cols-2 gap-4 mb-6">
<div class="bento-card p-5 flex flex-col items-center text-center">
<div class="w-12 h-12 rounded-xl bg-[#C9FFE5]/50 flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-[#059669] text-2xl">school</span>
</div>
<span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Department</span>
<span class="text-lg font-bold text-[var(--navy-text)]">Bsc.IT</span>
</div>
<div class="bento-card p-5 flex flex-col items-center text-center">
<div class="w-12 h-12 rounded-xl bg-[#FFD6C9]/50 flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-[#EA580C] text-2xl">domain</span>
</div>
<span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Block</span>
<span class="text-lg font-bold text-[var(--navy-text)]">Love hall</span>
</div>
</div>
<div class="bg-white/30 border border-white/60 rounded-2xl p-5 mb-8 flex items-center gap-4">
<div class="w-11 h-11 bg-white rounded-full flex items-center justify-center shadow-sm flex-shrink-0">
<span class="material-symbols-outlined text-[var(--primary-royal-blue)] text-xl">mail</span>
</div>
<div class="flex flex-col overflow-hidden">
<span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-0.5">Contact Email</span>
<span class="text-sm font-semibold text-[var(--navy-text)] truncate">yasin@americancollege.edu.in</span>
</div>
</div>
<button class="w-full bg-[var(--primary-royal-blue)] hover:bg-[#3D5AD9] text-white font-bold py-4 rounded-xl shadow-[0_10px_20px_-5px_rgba(74,108,247,0.4)] transition-all flex items-center justify-center gap-2 group">
<span>Close Profile</span>
<span class="material-symbols-outlined text-lg opacity-80 group-hover:scale-110 transition-transform">close</span>
</button>
</div>
<div class="fixed top-12 left-12 opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-8xl text-[var(--navy-text)]">school</span>
</div>
<div class="fixed bottom-12 right-12 opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-8xl text-[var(--primary-royal-blue)]">search</span>
</div>

</body></html>
